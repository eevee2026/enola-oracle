</style></head><body><audio id="backgroundMusic" src="music.m4a" autoplay loop preload="auto"></audio><main class="shell">

<script>
(function(){

{roman:'II',name:'月隐',en:'THE VEIL',verse:'看不清的，也不必急于看清。',text:'此刻尚未明朗的事情，不一定需要立刻得到答案。给自己一些观察和等待的空间。',symbol:'moon'},
{roman:'III',name:'回响',en:'THE ECHO',verse:'真诚的声音，终会留下回响。',text:'有些心意需要被表达，而不是一直等待对方猜测。试着说出你真正关心的事情。',symbol:'echo'},

function frame(t){if(mode!=='spin')return;var dt=rafT?Math.min(45,t-rafT):16;rafT=t;angle+=velocity*dt;velocity*=Math.pow(.925,dt/16);draw();if(Math.abs(velocity)<.013){ready();return}raf=requestAnimationFrame(frame)}

function clearTimers(){timers.forEach(clearTimeout);timers=[]}

const start=$('start'), stage=$('stage'), chart=ring.parentElement;
const music=$('backgroundMusic');
function playMusic(){if(music.paused)music.play().catch(()=>{})}
playMusic();
start.onclick=()=>{
  playMusic();
  start.hidden=true;
  stage.hidden=false;
  if(reduce){ring.focus({preventScroll:true});return}
  stage.inert=true;
  chart.classList.add('is-intro');
  $('stateMessage').textContent='星轨正在对齐';
  orbit.addEventListener('animationend',()=>{
    chart.classList.remove('is-intro');
    stage.inert=false;
    state('idle');
    ring.focus({preventScroll:true});
  },{once:true});

})();
